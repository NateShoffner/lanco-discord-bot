# Format 2.4 (not 3.x): docker-compose (non-swarm) only honors mem_limit /
# mem_reservation in the 2.x format. In 3.x these move under deploy.resources,
# which `docker-compose up` ignores outside swarm.
version: "2.4"

# Interpolated values (${...}) come from the shell or from the `.env` file next
# to THIS file, never from the env_file below. Set them there to run this stack
# as something other than production:
#
#   BOT_ENV=dev
#   CONTAINER_NAME=lanco-bot-dev
#   WEBSERVER_PORT=8081
#
# which loads .env.dev and reports itself as dev to Elastic APM. Run it from
# its own directory so the ./data volume below is a separate database.
#
# Log shipping lives in docker-compose.logging.yml; see that file to enable it.
services:
  app:
    image: ghcr.io/nateshoffner/lanco-discord-bot:latest
    container_name: ${CONTAINER_NAME:-lanco-bot}
    restart: unless-stopped
    env_file: .env.${BOT_ENV:-prod}
    environment:
      # Also set here, not just in the env_file, so it lands in the real
      # process environment where it outranks the file. A stray BOT_ENV inside
      # .env.prod cannot make a container that loaded prod's secrets call
      # itself dev.
      BOT_ENV: ${BOT_ENV:-prod}
      # Compose does not read the env_file for interpolation, only for the
      # container's env, so a WEBSERVER_PORT set there would not reach the
      # `ports` mapping below and the two could drift. Passing it explicitly
      # here (which takes precedence over env_file) keeps the published port and
      # the listening port the same value. Set it in the .env next to this file.
      WEBSERVER_PORT: ${WEBSERVER_PORT:-8080}
    # Embedded web server (webserver cog), serving /status
    ports:
      - "${WEBSERVER_PORT:-8080}:${WEBSERVER_PORT:-8080}"
    # Hard cap so a memory spike/leak restarts THIS container cleanly instead of
    # the host OOM killer reaping the process. 512m fits the bot's normal usage
    # with headroom; raise it if `docker stats` shows it sitting near the limit.
    mem_limit: 512m
    mem_reservation: 256m
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: ${CONTAINER_NAME:-lanco-bot}

  # Recreates `app` when :latest moves, which is what makes a push to master
  # deploy without CI holding an ssh key to this box. See CLAUDE.md.
  #
  # nicholas-fedor/watchtower, NOT containrrr/watchtower: the original was
  # archived read-only in December 2025. The fork is config-compatible.
  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:1.23.0
    container_name: ${CONTAINER_NAME:-lanco-bot}-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      # Scoped to this stack, so a dev stack alongside prod does not recreate
      # prod's bot and vice versa.
      WATCHTOWER_SCOPE: ${CONTAINER_NAME:-lanco-bot}
      # Off by default, which would leave a crash-looping bot unfixable by
      # deploy: `restart: unless-stopped` parks a container that exits on boot
      # in the `restarting` state, and Watchtower skips those.
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_LOG_LEVEL: "info"
    labels:
      # Needs its own scope label to clean up superseded images correctly.
      com.centurylinklabs.watchtower.scope: ${CONTAINER_NAME:-lanco-bot}
    mem_limit: 128m

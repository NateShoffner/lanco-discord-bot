name: Build & Publish

on:
  push:
    branches:
      - master
    paths:
      - "app/**"
      - "tests/**"
      - "migrations/**"
      - "tools/**"
      - "pyproject.toml"
      - "poetry.lock"
      - "Dockerfile"
      - ".github/workflows/deploy.yml"
      # No compose/filebeat paths: nothing here consumes them, so building on a
      # compose edit would republish :latest and bounce the bot for an
      # identical image. Applying one is a manual `up -d`; see CLAUDE.md.

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Read from the Dockerfile so a base image bump moves the tests with it.
      - name: Resolve the Python version from the Dockerfile
        run: |
          version=$(sed -nE 's/^FROM python:([0-9]+\.[0-9]+)-slim.*/\1/p' Dockerfile | head -1)
          test -n "$version" || { echo "no python version found in Dockerfile"; exit 1; }
          echo "PYTHON_VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install

      - name: Run tests
        run: poetry run test

  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set lowercase image name
        run: echo "IMAGE_NAME_LC=$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Commit tag only. :latest is the deploy, so it waits for the smoke test.
      - name: Build and push the commit tag
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            GIT_COMMIT_HASH=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:${{ github.sha }}

      # The test job runs on the runner against its own venv, so this is the only
      # step that executes the image's.
      - name: Smoke test the image
        run: |
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:${{ github.sha }} \
            python -c "import discord, aiohttp, yarl, peewee, pydantic, cairosvg, fitz; print('imports ok')"

      # A registry-side retag of the image just tested, not a second build.
      - name: Promote to latest
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:${{ github.sha }}

# Publishing :latest is the whole deploy. Watchtower on the host polls ghcr and
# recreates the bot when the tag moves, so this pipeline holds no credential to
# the host. See docker-compose.yml, and CLAUDE.md for what it does not cover.
